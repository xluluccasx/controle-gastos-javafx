<!DOCTYPE html>
<html lang="pt-BR">
<!-- Formulario web para cadastrar receitas e despesas. -->
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar Lancamento - Controle de Gastos</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="page">
    <!-- Cabecalho com identificacao da pagina e acoes de navegacao. -->
    <header class="topbar">
        <div>
            <h1>Controle de Gastos</h1>
            <p class="subtitle">Criar lancamento</p>
        </div>
        <div class="user-box">
            <a class="btn btn-light nav-link" href="dashboard.html">Dashboard</a>
            <a class="btn btn-light nav-link" href="dashboard.html">Voltar ao menu</a>
        </div>
    </header>

    <!-- Conteudo principal desta tela. -->
    <main>
        <!-- Agrupa os dados e controles desta etapa da interface. -->
        <section class="card auth-card">
            <h2>Novo lancamento</h2>

            <div class="form-grid">
                <div>
                    <label for="type">Tipo</label>
                    <select id="type">
                        <option value="INCOME">Receita</option>
                        <option value="EXPENSE">Despesa</option>
                    </select>
                </div>

                <div>
                    <label for="category">Categoria</label>
                    <select id="category"></select>
                </div>

                <div>
                    <label for="amount">Valor</label>
                    <input id="amount" type="number" step="0.01" min="0.01" placeholder="0,00" />
                </div>

                <div>
                    <label for="date">Data</label>
                    <input id="date" type="date" />
                </div>
            </div>

            <div>
                <label for="description">Descricao</label>
                <input id="description" type="text" placeholder="Descricao do lancamento" />
            </div>
            <div>
                <label for="receiptFile">Comprovante</label>
                <input id="receiptFile" type="file" accept="image/*,.pdf" />
            </div>
            <div class="actions">
                <button id="btnSaveAndExit" class="btn btn-primary">Salvar e sair</button>
                <button id="btnSaveAndContinue" class="btn btn-secondary">Salvar e continuar</button>
                <a class="btn btn-light nav-link" href="categorias.html">Gerenciar categorias</a>
            </div>

            <p id="txStatus" class="status"></p>
        </section>
    </main>
</div>
<div id="toast" class="toast"></div>
<!-- Carrega a logica da pagina como modulo JavaScript. -->
<script type="module" src="js/app.js"></script>
</body>
</html>
