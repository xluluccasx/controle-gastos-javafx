<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controle de Gastos</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="page">
    <header class="topbar">
        <div>
            <h1>Controle de Gastos</h1>
            <p class="subtitle">Acesso web</p>
        </div>
        <div id="userBox" class="user-box hidden">
            <span id="userEmail"></span>

            <button id="btnLogout" class="btn btn-danger">Sair</button>

        </div>
    </header>
    <main>
        <!-- AUTENTICAÇÃO -->
        <section id="authSection" class="card auth-card">
            <h2>Acesso</h2>

            <div class="form-grid">
                <div>
                    <label for="email">E-mail</label>
                    <input id="email" type="email" placeholder="seuemail@exemplo.com" />
                </div>

                <div>
                    <label for="password">Senha</label>
                    <input id="password" type="password" placeholder="Digite sua senha" />
                </div>
            </div>

            <div class="actions">
                <button id="btnLogin" class="btn btn-primary">Entrar</button>
                <button id="btnSignup" class="btn btn-secondary">Criar conta</button>
                <button id="btnForgot" class="btn btn-light">Esqueci a senha</button>
            </div>

            <p id="authStatus" class="status"></p>
        </section>

        <!-- DASHBOARD -->
        <section id="dashboardSection" class="hidden">
            <div class="dashboard-header card">
                <div class="filter-row">
                    <div class="filters">
                        <div class="date-range">
                            <div class="date-range">
                                <div class="field">
                                    <label>Data inicial</label>
                                    <input type="date" id="startDate" class="date-animated">
                                </div>

                                <div class="field">
                                    <label>Data final</label>
                                    <input type="date" id="endDate" class="date-animated">
                                </div>

                                <button id="btnApplyFilter" class="btn btn-primary">Aplicar</button>
                            </div>
                    </div>
                    <button id="btnRefresh" class="btn btn-light">Atualizar</button>
                </div>
            </div>

            <div class="kpis">
                <div class="card kpi">
                    <h3>Receitas</h3>
                    <p id="kpiIncome">R$ 0,00</p>
                </div>
                <div class="card kpi">
                    <h3>Despesas</h3>
                    <p id="kpiExpense">R$ 0,00</p>
                </div>
                <div class="card kpi">
                    <h3>Saldo</h3>
                    <p id="kpiBalance">R$ 0,00</p>
                </div>
            </div>

            <div class="content-grid">
                <section class="card">
                    <h2>Novo lançamento</h2>

                    <div class="form-grid">
                        <div>
                            <label for="type">Tipo</label>
                            <select id="type">
                                <option value="INCOME">Receita</option>
                                <option value="EXPENSE">Despesa</option>
                            </select>
                        </div>
                        <button id="btnManageCategories" class="btn btn-light">
                            Gerenciar categorias
                        </button>

                        <div>
                            <label for="category">Categoria</label>
                            <select id="category">
                            </select>
                        </div>

                        <div>
                            <label for="amount">Valor</label>
                            <input id="amount" type="number" step="0.01" min="0.01" placeholder="0,00" />
                        </div>

                        <div>
                            <label for="date">Data</label>
                            <input id="date" type="date" />
                        </div>
                    </div>

                    <div>
                        <label for="description">Descrição</label>
                        <input id="description" type="text" placeholder="Descrição do lançamento" />
                    </div>
                    <div>
                        <label for="receiptFile">Comprovante</label>
                        <input id="receiptFile" type="file" accept="image/*,.pdf" />
                    </div>
                    <div class="actions">
                        <button id="btnAddTransaction" class="btn btn-primary">Salvar lançamento</button>
                    </div>

                    <p id="txStatus" class="status"></p>
                </section>
                <section class="card">
                    <h2>Gráficos</h2>
                    <div class="chart-wrap">
                        <canvas id="pieChart"></canvas>
                    </div>
                    <div class="chart-wrap">
                        <canvas id="barChart"></canvas>
                    </div>
                </section>
            </div>

            <section class="card">
                <h2>Lançamentos do mês</h2>
                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr>
                            <th>Data</th>
                            <th>Tipo</th>
                            <th>Categoria</th>
                            <th>Valor</th>
                            <th>Descrição</th>
                            <th>Cadastro</th>
                            <th>Ação</th>
                        </tr>
                        </thead>
                        <tbody id="transactionsTable"></tbody>
                        <button id="btnExportPdf" class="btn btn-light">Exportar PDF</button>
                    </table>
                </div>
            </section>
        </section>
        <section id="categorySection" class="hidden">

                    <div class="card">
                        <h2>Gerenciar Categorias</h2>

                        <button id="btnBackDashboard" class="btn btn-light">
                            ← Voltar
                        </button>

                        <div style="margin-top: 16px;">
                            <input type="text" id="newCategoryName" placeholder="Nova categoria">
                            <select id="newCategoryType">
                                <option value="INCOME">Receita</option>
                                <option value="EXPENSE">Despesa</option>
                            </select>
                            <button id="btnAddCategory" class="btn btn-primary">Adicionar</button>
                            <button id="btnSaveCategories" class="btn btn-primary" style="margin-top: 16px;">Salvar alterações</button>
                        </div>

                        <ul id="categoryList" style="margin-top: 20px;"></ul>
                    </div>

        </section>
    </main>
</div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
