<!DOCTYPE html>
<html lang="pt-BR">
<!-- Pagina inicial com acesso ao aplicativo web e ao instalador desktop. -->
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Controle de Gastos</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="page">
    <!-- Cabecalho com identificacao da pagina e acoes de navegacao. -->
    <header class="topbar">
        <div>
            <h1>Controle de Gastos</h1>
            <p class="subtitle">Acesso web</p>
        </div>
    </header>

    <!-- Conteudo principal desta tela. -->
    <main>
        <!-- Agrupa os dados e controles desta etapa da interface. -->
        <section class="card download-card">
            <div>
                <h2>Aplicativo para Windows</h2>
                <p>Baixe o instalador do app desktop para usar o Controle de Gastos no computador.</p>
            </div>
            <a class="btn btn-primary" href="downloads/Controle-de-Gastos-Setup.exe" download>Baixar instalador</a>
        </section>

        <!-- Agrupa os dados e controles desta etapa da interface. -->
        <section class="card auth-card">
            <h2>Acesso</h2>

            <div class="form-grid">
                <div>
                    <label for="email">E-mail</label>
                    <input id="email" type="email" placeholder="seuemail@exemplo.com" />
                </div>

                <div>
                    <label for="password">Senha</label>
                    <input id="password" type="password" placeholder="Digite sua senha" />
                </div>
            </div>

            <div class="actions">
                <button id="btnLogin" class="btn btn-primary">Entrar</button>
                <button id="btnSignup" class="btn btn-secondary">Criar conta</button>
                <button id="btnForgot" class="btn btn-light">Esqueci a senha</button>
            </div>

            <p id="authStatus" class="status"></p>
        </section>
    </main>
</div>
<div id="toast" class="toast"></div>
<!-- Carrega a logica da pagina como modulo JavaScript. -->
<script type="module" src="js/app.js"></script>
</body>
</html>
