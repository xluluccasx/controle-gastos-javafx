<!DOCTYPE html>
<html lang="pt-BR">
<!-- Tela de criacao e gerenciamento das categorias do usuario. -->
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categorias - Controle de Gastos</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="page">
    <!-- Cabecalho com identificacao da pagina e acoes de navegacao. -->
    <header class="topbar">
        <div>
            <h1>Controle de Gastos</h1>
            <p class="subtitle">Gerenciar categorias</p>
        </div>
        <div class="user-box">
            <a class="btn btn-light nav-link" href="dashboard.html">Dashboard</a>
        </div>
    </header>

    <!-- Conteudo principal desta tela. -->
    <main>
        <!-- Agrupa os dados e controles desta etapa da interface. -->
        <section class="card auth-card">
            <h2>Gerenciar Categorias</h2>

            <div class="form-grid">
                <div>
                    <label for="newCategoryName">Nova categoria</label>
                    <input type="text" id="newCategoryName" placeholder="Nova categoria">
                </div>
                <div>
                    <label for="newCategoryType">Tipo</label>
                    <select id="newCategoryType">
                        <option value="INCOME">Receita</option>
                        <option value="EXPENSE">Despesa</option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <button id="btnAddCategory" class="btn btn-primary">Adicionar</button>
                <button id="btnSaveCategories" class="btn btn-primary">Salvar alteracoes</button>
            </div>

            <div class="category-filters">
                <div>
                    <label for="categoryTypeFilter">Filtrar por tipo</label>
                    <select id="categoryTypeFilter">
                        <option value="ALL">Todas</option>
                        <option value="INCOME">Receitas</option>
                        <option value="EXPENSE">Despesas</option>
                    </select>
                </div>
                <div>
                    <label for="categoryStatusFilter">Filtrar por status</label>
                    <select id="categoryStatusFilter">
                        <option value="ALL">Todas</option>
                        <option value="ACTIVE">Ativas</option>
                        <option value="HIDDEN">Ocultas</option>
                    </select>
                </div>
            </div>

            <ul id="categoryList" class="category-list"></ul>
            <p id="categoryStatus" class="status"></p>
        </section>
    </main>
</div>
<div id="toast" class="toast"></div>
<!-- Carrega a logica da pagina como modulo JavaScript. -->
<script type="module" src="js/app.js"></script>
</body>
</html>
